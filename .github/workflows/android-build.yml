name: Android debug build

# Builds an installable debug APK in the cloud so you can put the app on a
# device without a local Android toolchain. Download it from the run's
# "Artifacts" section, or install directly with `adb install app-debug.apk`.

# Manual-only: this repo's account can't currently allocate Actions runners,
# so the workflow is not wired to push/PR events (it would stamp a red ❌ on
# every commit). Once Actions is re-enabled on the account, run it on demand
# from the Actions tab → "Run workflow", or re-add push/pull_request triggers.
on:
  workflow_dispatch: {}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets + config into the native project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: afroe-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
